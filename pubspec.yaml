name: qr_code_generator_reader
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  permission_handler: ^12.0.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/qr_scanner_logo.png"

  web:
    generate: true
    image_path: "assets/icon/qr_scanner_logo.png"

  windows:
    generate: true
    image_path: "assets/icon/qr_scanner_logo.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/icon/qr_scanner_logo.png"